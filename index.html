<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird with Spikes</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #70c5ce;
    margin: 0;
    overflow: hidden;
    font-family: sans-serif;
  }
  canvas {
    background: #70c5ce;
    border: 2px solid #000;
  }
</style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const gravity = 0.6;
const jumpHeight = -10;
let gameOver = false;

let bird = {
  x: 50,
  y: 300,
  width: 30,
  height: 30,
  velocity: 0
};

let pipes = [];
let pipeWidth = 50;
let gapHeight = 150;
let pipeSpeed = 2;
let score = 0;

// Load high score from localStorage
let highScore = 0;
if (localStorage.getItem("flappyHighScore")) {
  const data = JSON.parse(localStorage.getItem("flappyHighScore"));
  highScore = data.highScore || 0;
}

// Create new pipes
function createPipe() {
  let topHeight = Math.random() * (canvas.height - gapHeight - 100) + 50;
  pipes.push({
    x: canvas.width,
    top: topHeight,
    bottom: canvas.height - topHeight - gapHeight,
    scored: false
  });
}

// Handle bird jump
function jump() {
  bird.velocity = jumpHeight;
}

// Save high score to localStorage
function saveHighScore(score) {
  const data = { highScore: score };
  localStorage.setItem("flappyHighScore", JSON.stringify(data));
}

// Draw bird with more details
function drawBird() {
  // Body
  ctx.fillStyle = "yellow";
  ctx.beginPath();
  ctx.arc(bird.x + bird.width/2, bird.y + bird.height/2, bird.width/2, 0, Math.PI * 2);
  ctx.fill();
  ctx.closePath();

  // Eye
  ctx.fillStyle = "black";
  ctx.beginPath();
  ctx.arc(bird.x + bird.width*0.65, bird.y + bird.height*0.35, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.closePath();

  // Beak
  ctx.fillStyle = "orange";
  ctx.beginPath();
  ctx.moveTo(bird.x + bird.width, bird.y + bird.height/2 - 5);
  ctx.lineTo(bird.x + bird.width + 10, bird.y + bird.height/2);
  ctx.lineTo(bird.x + bird.width, bird.y + bird.height/2 + 5);
  ctx.fill();
  ctx.closePath();
}

// Draw pipes with spikes
function drawPipeWithSpikes(pipe) {
  ctx.fillStyle = "green";
  // Top pipe
  ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
  // Bottom pipe
  ctx.fillRect(pipe.x, canvas.height - pipe.bottom, pipeWidth, pipe.bottom);

  // Top spikes
  ctx.fillStyle = "darkgreen";
  for(let i=0; i<pipeWidth; i+=10){
    ctx.beginPath();
    ctx.moveTo(pipe.x + i, pipe.top);
    ctx.lineTo(pipe.x + i + 5, pipe.top - 10);
    ctx.lineTo(pipe.x + i + 10, pipe.top);
    ctx.fill();
    ctx.closePath();
  }

  // Bottom spikes
  for(let i=0; i<pipeWidth; i+=10){
    ctx.beginPath();
    ctx.moveTo(pipe.x + i, canvas.height - pipe.bottom);
    ctx.lineTo(pipe.x + i + 5, canvas.height - pipe.bottom + 10);
    ctx.lineTo(pipe.x + i + 10, canvas.height - pipe.bottom);
    ctx.fill();
    ctx.closePath();
  }
}

// Game loop
let frame = 0;
function update() {
  if (gameOver) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Bird physics
  bird.velocity += gravity;
  bird.y += bird.velocity;

  drawBird();

  // Pipes
  for (let i = 0; i < pipes.length; i++) {
    let p = pipes[i];
    p.x -= pipeSpeed;
    drawPipeWithSpikes(p);

    // Collision detection
    if (
      bird.x < p.x + pipeWidth &&
      bird.x + bird.width > p.x &&
      (bird.y < p.top || bird.y + bird.height > canvas.height - p.bottom)
    ) {
      gameOver = true;
      if (score > highScore) {
        highScore = score;
        saveHighScore(highScore);
      }
      alert("Game Over! Score: " + score + "\nHigh Score: " + highScore);
      document.location.reload();
    }

    // Increase score when bird passes pipe
    if (!p.scored && p.x + pipeWidth < bird.x) {
      score++;
      p.scored = true;
    }
  }

  // Remove offscreen pipes
  if (pipes.length > 0 && pipes[0].x + pipeWidth < 0) {
    pipes.shift();
  }

  // Draw score
  ctx.fillStyle = "white";
  ctx.font = "24px Arial";
  ctx.fillText("Score: " + score, 10, 30);
  ctx.fillText("High Score: " + highScore, 10, 60);

  // Add pipes every 150 frames
  if (frame % 150 === 0) {
    createPipe();
  }

  frame++;
  requestAnimationFrame(update);
}

document.addEventListener("keydown", jump);
document.addEventListener("click", jump);

update();
</script>
</body>
</html>
